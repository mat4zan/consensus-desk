  - id: fed_september_2026_cut
    question: "Fed cuts 25bp at the September 2026 FOMC meeting"
    domain: macro
    resolution: >
      The FOMC lowers the target range by 25bp or more at its September 2026
      meeting.
    expiry: 2026-09-30
    review: 2026-08-15
    oracle:
      source: fred
      series: DFEDTARU
      rule: dropped
      amount: 0.25
      window_start: 2026-09-10
      by: 2026-10-01
    sources:
      kalshi:
        id: "KXFEDDECISION-26SEP-C25"
        criteria_note: >
          Ticker is the "cut exactly 25bp" outcome. A >25bp cut resolves the
          -C26 ticker instead, so this slightly under-counts the canonical
          "25bp or more". Combine C25 + C26 if that gap ever matters.

  - id: senate_control_2026_r
    question: "Republicans control the US Senate after the 2026 midterms"
    domain: elections
    resolution: >
      The Republican Party holds a Senate majority (50+ seats with the VP
      tiebreak, or 51+) in the Congress convening January 2027, per called
      results from a consensus of major networks.
    expiry: 2026-11-04
    review: 2026-10-15
    sources:
      polymarket:
        id: "will-the-republican-party-control-the-senate-after-the-2026-midterm-elections"
      predictit:
        id: 8155
        outcome: "Republican"
      manifold:
        id: "will-republicans-win-the-senate-in-738388924521"
        criteria_note: >
          Elections are the one theme traded on every venue at once, so this
          is the board's widest cross-source topic. Real-money venues
          (Polymarket, PredictIt) are correlation-damped together; Manifold
          is an independent play-money crowd.

  # Yahoo-backed oracle (no API key needed): BTC-USD daily close.
  - id: btc_100k_2026
    question: "Bitcoin reaches $100,000 in 2026"
    domain: crypto
    resolution: >
      Bitcoin (BTC-USD) trades at or above $100,000 at any point before
      2027-01-01, measured on daily closing price.
    expiry: 2026-12-31
    review: 2026-10-01
    oracle:
      source: yahoo
      symbol: BTC-USD
      rule: crossed_above
      threshold: 100000
      window_start: 2026-01-01
      by: 2026-12-31
    sources:
      polymarket:
        id: "will-bitcoin-reach-100000-by-december-31-2026-571-361-361"
        criteria_note: >
          The market resolves on any trade at/above $100k; the Yahoo oracle
          checks daily closes, so a brief intraday spike that does not close
          above $100k would not auto-resolve YES. Close enough to track together.
      manifold:
        id: "will-bitcoin-exceed-100000-before-d"

