  - id: world_war_3_by_2030
    question: "Will a World War 3 scale global conflict occur by 2030?"
    domain: geopolitics
    resolution: >
      Resolves YES if a conflict widely recognized as 'World War 3' (a large-scale multi-power global war, potentially involving nuclear weapons) breaks out before January 1, 2030. Because no venue has an exact WW3-by-2030 market, we use the closest available proxies: Polymarket's NATO x Russia military clash market (narrower time horizon, by Dec 31 2026) as an escalation-risk proxy, and Manifold's 'Ww3 with nuclear' market as the closest thematic match (no explicit end date, treated as an ongoing probability estimate).
    expiry: 2030-01-01
    review: 2030-01-01
    # Auto-added from a topic request on 2026-07-25.
    sources:
      polymarket:
        id: "nato-x-russia-military-clash-by-december-31-2026-244"
      manifold:
        id: "ww3-with-nuclear"

  - id: fed_rate_hike_by_july_2026
    question: "Will the Federal Reserve increase interest rates by the end of July 2026?"
    domain: macro
    resolution: >
      Resolves YES if the Federal Reserve raises its target federal funds rate on or before the specified deadline. Manifold market covers any Fed hike during all of 2026 (broader than just July). PredictIt market resolves based on a Fed vote to raise rates by Sept. 16, 2026 (slightly later than the requested end-of-July deadline).
    expiry: 2026-07-31
    review: 2026-07-31
    # Auto-added from a topic request on 2026-07-25.
    sources:
      polymarket:
        ids:
          - "will-the-fed-increase-interest-rates-by-25-bps-after-the-july-2026-meeting"
          - "will-the-fed-increase-interest-rates-by-50-bps-after-the-july-2026-meeting"
        criteria_note: >
          Polymarket splits the July FOMC decision into one binary market per
          outcome bucket (no change / hike 25bp / hike 50bp / cut 25bp / cut
          50bp) rather than a single "will they hike" market. The two hike
          buckets are summed here as mutually exclusive outcomes to get
          P(any increase) — verified live: ~24.05% + ~0.75% = ~24.8%.
      manifold:
        id: "will-the-federal-reserve-hike-inter-gcPlnRdpUp"
      predictit:
        id: "8885"
        outcome: "Will a majority of the Fed vote to raise rates by Sept. 16?"
      cme_fedwatch:
        id: "202607"
        criteria_note: >
          CME FedWatch: real-money futures pricing of P(hike) at July 2026 FOMC
          meeting. This is the most liquid signal of Fed policy expectations.

